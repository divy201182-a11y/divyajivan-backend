databases:
  - name: divyajivan-db
    plan: free
    databaseName: divyajivan
    user: divyajivan

services:
  - type: web
    plan: free
    name: divyajivan-backend
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: divyajivan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://divyajivan-health-app.netlify.app,http://localhost:5173
      - key: DEV_OTP_ENABLED
        value: "true"
      - key: DEV_OTP_CODE
        value: "123456"
      - key: SMS_PROVIDER
        value: console
      - key: WHATSAPP_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: RATE_LIMIT_MAX
        value: "1000"
